groups:
  - name: api-container
    rules:
      - alert: ContainerMemoryNearLimit
        expr: |
          container_memory_usage_bytes{id=~".*lab1-api.*"}
          / container_spec_memory_limit_bytes{id=~".*lab1-api.*"} > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "api использует >90% лимита памяти"
          description: "RSS {{ $value | humanizePercentage }}. Возможен OOMKill."

      - alert: ContainerCPUThrottling
        expr: |
          rate(container_cpu_cfs_throttled_periods_total{id=~".*lab1-api.*"}[5m])
          / rate(container_cpu_cfs_periods_total{id=~".*lab1-api.*"}[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "api упирается в CPU-лимит"
          description: "{{ $value | humanizePercentage }} периодов throttled."

      - alert: ContainerManyProcesses
        expr: |
          container_processes{id=~".*lab1-api.*"}
          / container_spec_processes_limit{id=~".*lab1-api.*"} > 0.8
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "api приближается к pids.max"
          description: "{{ $value | humanizePercentage }} от лимита."