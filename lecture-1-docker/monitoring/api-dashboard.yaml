apiVersion: v1
kind: ConfigMap
metadata:
  name: api-container-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  api-container.json: |
    {
      "title": "API Container Monitoring",
      "uid": "api-container",
      "panels": [
        {
          "title": "Memory Usage vs Limit",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "container_memory_usage_bytes{id=~\".*lab1-api.*\"} / 1024 / 1024",
              "legendFormat": "Usage (MB)"
            },
            {
              "expr": "container_spec_memory_limit_bytes{id=~\".*lab1-api.*\"} / 1024 / 1024",
              "legendFormat": "Limit (MB)"
            }
          ]
        },
        {
          "title": "CPU Throttling",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "rate(container_cpu_cfs_throttled_periods_total{id=~\".*lab1-api.*\"}[5m]) / rate(container_cpu_cfs_periods_total{id=~\".*lab1-api.*\"}[5m])",
              "legendFormat": "Throttled periods %"
            }
          ]
        },
        {
          "title": "Process Count vs pids.max",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "container_processes{id=~\".*lab1-api.*\"}",
              "legendFormat": "Processes"
            },
            {
              "expr": "container_spec_processes_limit{id=~\".*lab1-api.*\"}",
              "legendFormat": "Limit"
            }
          ]
        },
        {
          "title": "Network I/O",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "rate(container_network_receive_bytes_total{id=~\".*lab1-api.*\"}[1m])",
              "legendFormat": "RX bytes/s"
            },
            {
              "expr": "rate(container_network_transmit_bytes_total{id=~\".*lab1-api.*\"}[1m])",
              "legendFormat": "TX bytes/s"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" }
    }