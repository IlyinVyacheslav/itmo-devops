{{- $c := dict "root" . "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{ include "shop.labels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  progressDeadlineSeconds: {{ .Values.api.progressDeadlineSeconds }}
  minReadySeconds: {{ .Values.api.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.api.strategy.maxSurge }}
      maxUnavailable: {{ .Values.api.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{ include "shop.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{ include "shop.labels" $c | nindent 8 }}
    spec:
      securityContext:
        {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.global.registry }}/{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: uri
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: http
            {{ toYaml .Values.api.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: http
            {{ toYaml .Values.api.probes.liveness | nindent 12 }}
          resources:
            {{ toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{ toYaml .Values.securityContext | nindent 12 }}