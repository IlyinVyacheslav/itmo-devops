global:
  registry: docker.io/library
  labels:
    app.kubernetes.io/part-of: shop
    env: dev
    owner: bob

api:
  replicaCount: 3
  image:
    repository: shop-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 8080
  env:
    HEALTH_FAIL: "false"
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {cpu: 500m, memory: 256Mi}
  service:
    type: ClusterIP
    port: 80
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  probes:
    path: /health
    readiness: {initialDelaySeconds: 3, periodSeconds: 5, failureThreshold: 3}
    liveness:  {initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 3}
  progressDeadlineSeconds: 60
  minReadySeconds: 5

worker:
  replicaCount: 2
  image:
    repository: shop-worker
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 8081
  env: {}
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits:   {cpu: 250m, memory: 128Mi}
  service:
    enabled: true
    type: ClusterIP
    port: 80
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  probes:
    path: /health
    readiness: {initialDelaySeconds: 3, periodSeconds: 5, failureThreshold: 3}
    liveness:  {initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 3}
  progressDeadlineSeconds: 60
  minReadySeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

postgres:
  enabled: true
  instances: 1
  storage:
    size: 1Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits:   {cpu: 500m, memory: 512Mi}

serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics

prometheusRules:
  groups:
    - name: shop.rules
      rules:
        - alert: ShopRolloutStuck
          expr: |
            kube_deployment_status_replicas_unavailable{namespace="{{ .Release.Namespace }}", deployment=~"{{ .Release.Name }}-(api|worker)"} > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Rollout api/worker завис: есть неготовые реплики дольше минуты"

        - alert: ShopPodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}"}[5m]) > 2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Контейнер в namespace shop перезапускается более 2 раз за 5 минут"

        - alert: ShopPostgresDown
          expr: |
            (sum(kube_pod_status_ready{namespace="{{ .Release.Namespace }}", pod=~"{{ .Release.Name }}-postgres-[0-9]+", condition="true"}) or vector(0)) < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Нет ни одного готового пода postgres"