apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
spec:
  background: true
  rules:
    - name: require-cpu-and-memory-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        message: "Every container must define CPU and memory limits."
        pattern:
          spec:
            containers:
              - name: "*"
                resources:
                  limits:
                    cpu: "?*"
                    memory: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: trusted-image-registry
spec:
  background: true
  validationFailureAction: Enforce
  rules:
    - name: only-library-images
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Images must come from docker.io/library/."
        pattern:
          spec:
            containers:
              - image: "docker.io/library/*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-labels
spec:
  background: true
  rules:
    - name: require-app-and-owner
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        message: "Pod must have app and owner labels."
        pattern:
          metadata:
            labels:
              app: "?*"
              owner: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged
spec:
  background: true
  rules:
    - name: no-privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        message: "Privileged containers are forbidden."
        pattern:
          spec:
            containers:
              - name: "*"
                =(securityContext):
                  =(privileged): false
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
spec:
  background: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        message: "Pod must set runAsNonRoot to true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
