apiVersion: v1
kind: Pod
metadata:
  name: loadgen
  labels: {app.kubernetes.io/name: loadgen, app.kubernetes.io/part-of: shop, owner: bob, env: dev}
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: loadgen
      image: docker.io/library/busybox:1.36
      command: ["sh", "-c"]
      args:
        - 'while true; do if wget -q -T 2 -O /dev/null http://shop-api/health; then echo "$(date +%T) 200"; else echo "$(date +%T) FAIL"; fi; sleep 2.5; done'
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits:   {cpu: 50m, memory: 32Mi}
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false