apiVersion: v1
kind: Pod
metadata:
  name: untrusted-image
  labels:
    app.kubernetes.io/name: test
    app.kubernetes.io/part-of: shop
    owner: bob
    env: dev
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: hello-world
      image: bob.example.com/hello-world:latest
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
