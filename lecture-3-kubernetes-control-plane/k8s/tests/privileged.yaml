apiVersion: v1
kind: Pod
metadata:
  name: privileged
  labels:
    app.kubernetes.io/name: test
    app.kubernetes.io/part-of: shop
    owner: bob
    env: dev
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: hello-world
      image: docker.io/library/hello-world:latest
      securityContext:
        privileged: true
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"