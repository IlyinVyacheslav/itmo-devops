global:
  registry: docker.io/library
  labels:
    app.kubernetes.io/part-of: shop
    env: dev
    owner: bob

# Часть 9: ServiceMonitor скребёт /metrics api и worker (RED-метрики),
# PrometheusRule с тремя алертами критического пути.
serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics

api:
  scheduling:
    mode: topologySpreadConstraints   # podAntiAffinity | topologySpreadConstraints
    topologySpread:
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
  replicaCount: 3
  image:
    repository: shop-api
    tag: "1.0.1"
    pullPolicy: IfNotPresent
  port: 8080
  env:
    HEALTH_FAIL: "false"
  priorityClassName: shop-critical
  resources:
    # --- история api (requests / limits) ---
    # Лаба 2/3:      100m/128Mi / 500m/256Mi
    # Часть 3 (krr): 10m/100Mi / 500m/100Mi        # Burstable
    # Часть 5:       250m/128Mi / 250m/128Mi       # Guaranteed (requests == limits)
    requests: {cpu: 250m, memory: 128Mi}
    limits:   {cpu: 250m, memory: 128Mi}
  service:
    type: ClusterIP
    port: 80
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  probes:
    path: /health
    readiness: {initialDelaySeconds: 3, periodSeconds: 5, failureThreshold: 3}
    liveness:  {initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 3}
  progressDeadlineSeconds: 60
  minReadySeconds: 5

worker:
  replicaCount: 2
  image:
    repository: shop-worker
    tag: "1.0.1"
    pullPolicy: IfNotPresent
  port: 8081
  env: {}
  resources:
    # --- история worker (requests / limits) ---
    # Лаба 2/3:      50m/64Mi / 250m/128Mi
    # Часть 3 (krr): 10m/100Mi / 250m/100Mi
    requests: {cpu: 10m, memory: 100Mi}
    limits:   {cpu: 250m, memory: 100Mi}
  service:
    enabled: true
    type: ClusterIP
    port: 80
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  probes:
    path: /health
    readiness: {initialDelaySeconds: 3, periodSeconds: 5, failureThreshold: 3}
    liveness:  {initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 3}
  progressDeadlineSeconds: 60
  minReadySeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

postgres:
  enabled: true
  instances: 1
  storage:
    size: 1Gi
  resources:
    # --- история postgres (requests / limits) ---
    # Лаба 2/3:        100m/256Mi / 500m/512Mi
    # Часть 3 (расчёт): 30m/88Mi / 500m/88Mi         # из Prometheus (99p CPU, max wss)
    # Часть 5:         250m/512Mi / 250m/512Mi       # Guaranteed (requests == limits)
    requests: {cpu: 250m, memory: 512Mi}
    limits:   {cpu: 250m, memory: 512Mi}

batch:
  enabled: true
  replicaCount: 2
  image:
    repository: batch
    tag: "0.2.2"
    pullPolicy: IfNotPresent
  env:
    # Часть 8 (графики в Grafana, исторический вариант): сценарий A — 4 реплики × 3
    # CPU-воркера, лимит 300m, для скриншотов дашборда. Возвращено к Части 5:
    # replicaCount 2, CPU_WORKERS 1.
    BATCH_CPU_WORKERS: "1"
    BATCH_MEM_MB: "128"
  priorityClassName: shop-batch
  # --- история batch (requests / limits) ---
  # Части 0-2:   100m/128Mi / 200m/256Mi
  # Часть 3 (krr): 202m/151Mi / 300m/151Mi
  # Часть 5:     202m/151Mi / 300m/256Mi        # Burstable
  # Часть 7: эксперименты по памяти (4×700, 4×1750, single-hog, замедленный
  #   темп) — стабильно OOMKilled, т.к. нода 7.7Gi + общий хост; после демо
  #   batch возвращён в состояние Части 5. Подробности в репорте, Часть 7.
  # Часть 8: перегрузка CPU — 6×2000m (жрал worker до 12 ядер, валил мониторинг
  #   на той же ноде). Возвращено к Части 5 как финальное состояние.
  resources:
    requests: {cpu: 202m, memory: 151Mi}
    limits:   {cpu: 300m, memory: 256Mi}

# Приоритеты для Части 5: критический путь (api) — высокий, batch — ниже
# дефолта, чтобы в Части 6 его первым делом вытесняли при нехватке ресурсов.
priorityClasses:
  - name: shop-critical
    value: 1000
  - name: shop-batch
    value: -10

# PDB для Части 5. Для api — вручную (не даёт потерять больше одной реплики
# при добровольном сбое). Для postgres PDB не создаём: им управляет CNPG.
podDisruptionBudgets:
  api:
    enabled: true
    minAvailable: 2
  worker:
    enabled: true
    minAvailable: 1
