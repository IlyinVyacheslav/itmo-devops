{{- if .Values.serviceMonitor.enabled }}
# Часть 9: /metrics api и worker скребёт Prometheus, RED-метрики → Grafana/алерты.
{{- $c := dict "root" . "component" "api" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{ include "shop.labels" $c | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{ include "shop.selectorLabels" $c | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
---
{{- $w := dict "root" . "component" "worker" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{ include "shop.labels" $w | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{ include "shop.selectorLabels" $w | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
