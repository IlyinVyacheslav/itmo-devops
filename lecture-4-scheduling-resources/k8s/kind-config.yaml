# Кластер под Лабу 4 — тесный и из двух нод.
# С control-plane убираем taint: иначе управляющая нода не принимает поды
# с работой, и разносить API было бы некуда — только на одну worker-ноду.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          taints: []
  - role: worker
